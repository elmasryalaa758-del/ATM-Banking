<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Checkout System</title>
</head>
<body>

    <h2>E-Commerce Checkout System</h2>

    <label>Customer Name:</label><br>
    <input type="text" id="customer"><br><br>

    <label>Product Category:</label><br>
    <select id="category">
        <option>Electronics</option>
        <option>Clothing</option>
        <option>Food</option>
    </select><br><br>

    <label>Product Price:</label><br>
    <input type="number" id="price"><br><br>

    <label>Quantity:</label><br>
    <input type="number" id="quantity"><br><br>

    <label>Coupon Code:</label><br>
    <input type="text" id="coupon"><br><br>

    <label>Payment Method:</label><br>
    <select id="payment">
        <option>Cash</option>
        <option>Visa</option>
        <option>Wallet</option>
    </select><br><br>

    <button onclick="checkout()">Checkout</button>

    <hr>

    <div id="invoice"></div>

    <script src="script.js"></script>

</body>
</html>
